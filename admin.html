<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffGrid Mesh Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    h2 { color: #38bdf8; margin-bottom: 12px; }
    .status {
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .status-off { background: #991b1b; color: #fecaca; }
    .status-on { background: #15803d; color: #4ade80; }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      flex: 1;
      min-width: 100px;
      transition: 0.2s;
    }
    button.start { background: #059669; color: white; }
    button.start:hover { background: #10b981; }
    button.stop { background: #dc2626; color: white; }
    button.stop:hover { background: #ef4444; }
    button.restart { background: #f59e0b; color: #1e293b; }
    button.restart:hover { background: #fbbf24; }
    .log-container {
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      height: 400px;
      overflow-y: auto;
      border: 1px solid #1e293b;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .log-line {
      padding: 2px 0;
      border-bottom: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <h2>🛠️ OffGrid Mesh Control Panel</h2>
  <div class="card">
    <h3>Server Status</h3>
    <div id="statusDisplay" class="status status-off">⏳ Unknown</div>
    <div class="btn-group">
      <button class="start" onclick="sendCommand('start')">▶️ Start</button>
      <button class="stop" onclick="sendCommand('stop')">⏹️ Stop</button>
      <button class="restart" onclick="sendCommand('restart')">🔄 Restart</button>
    </div>
  </div>
  <div class="card">
    <h3>Live Logs</h3>
    <div id="logContainer" class="log-container"></div>
  </div>
  <script>
    async function sendCommand(cmd) {
      if (cmd === 'restart') {
        await fetch('/stop');
        setTimeout(() => fetch('/start'), 500);
        return;
      }
      const res = await fetch(`/${cmd}`);
      const data = await res.json();
      updateStatus();
      fetchLogs();
    }
    async function updateStatus() {
      const res = await fetch('/status');
      const data = await res.json();
      const el = document.getElementById('statusDisplay');
      if (data.running) {
        el.className = 'status status-on';
        el.innerText = '✅ Running';
      } else {
        el.className = 'status status-off';
        el.innerText = '⛔ Stopped';
      }
    }
    async function fetchLogs() {
      const res = await fetch('/logs');
      const data = await res.json();
      const container = document.getElementById('logContainer');
      container.innerHTML = data.logs.map(line => 
        `<div class="log-line">${line}</div>`
      ).join('');
      container.scrollTop = container.scrollHeight;
    }
    setInterval(fetchLogs, 1000);
    setInterval(updateStatus, 2000);
    fetchLogs();
    updateStatus();
  </script>
</body>
</html>
