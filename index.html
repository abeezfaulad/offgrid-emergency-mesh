<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffGrid Emergency Mesh</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .card { background: #1e293b; padding: 18px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #334155; }
    h2, h3 { margin-top: 0; color: #38bdf8; }
    input { width: calc(100% - 24px); padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 10px; font-size: 14px; }
    button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 14px; }
    .status { padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 10px; }
    .status-off { background: #dc2626; color: #fecaca; }
    .status-on { background: #15803d; color: #4ade80; }
    .feed { background: #020617; padding: 12px; border-radius: 8px; min-height: 120px; max-height: 200px; overflow-y: auto; border: 1px solid #1e293b; }
    .msg { padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
    .code-box { font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #4ade80; text-align: center; padding: 10px; background: #020617; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>⚡ OffGrid Emergency Mesh</h2>

  <div class="card">
    <h3>Network Status</h3>
    <div id="status" class="status status-off">OFFLINE - CONNECTING TO LOCAL SERVER...</div>
  </div>

  <div class="card">
    <h3>Your Device Code</h3>
    <div id="my-code" class="code-box">------</div>
  </div>

  <div class="card">
    <h3>Broadcast Emergency Message</h3>
    <input type="text" id="msg-input" placeholder="Type emergency message...">
    <button onclick="sendMessage()">SEND LOCAL BROADCAST</button>
  </div>

  <div class="card">
    <h3>Local Bulletin Feed</h3>
    <div id="bulletin-feed" class="feed"></div>
  </div>

  <script>
    function generateNodeCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    const myCode = generateNodeCode();
    document.getElementById('my-code').innerText = myCode;

    // Connect to local laptop IP WebSocket automatically
    const host = window.location.hostname || 'localhost';
    const ws = new WebSocket(`ws://${host}:3000`);

    ws.onopen = () => {
      const statusDiv = document.getElementById('status');
      statusDiv.className = 'status status-on';
      statusDiv.innerText = 'CONNECTED TO LOCAL OFFLINE MESH NETWORK';
      
      ws.send(JSON.stringify({ type: 'REGISTER', code: myCode }));
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'BROADCAST') {
        appendFeed(data.sender, data.text);
      }
    };

    ws.onclose = () => {
      const statusDiv = document.getElementById('status');
      statusDiv.className = 'status status-off';
      statusDiv.innerText = 'DISCONNECTED FROM LOCAL NETWORK';
    };

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      const payload = {
        type: 'BROADCAST',
        sender: myCode,
        text: text
      };

      ws.send(JSON.stringify(payload));
      input.value = '';
    }

    function appendFeed(sender, text) {
      const feed = document.getElementById('bulletin-feed');
      const div = document.createElement('div');
      div.className = 'msg';
      const isMe = sender === myCode;
      div.innerHTML = `<strong style="color:${isMe ? '#4ade80' : '#38bdf8'};">[${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}] Node (${sender}):</strong> ${text}`;
      feed.appendChild(div);
      feed.scrollTop = feed.scrollHeight;
    }
  </script>
</body>
</html>
