<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>offline-mesh | Emergency Local Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981;
      --btn-blue: #3b82f6;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 680px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: 1.8rem;
    }

    .badge {
      background: var(--accent);
      color: #0f172a;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .btn-qr {
      background: var(--btn-blue);
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      background: #0f172a;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      border-left: 4px solid var(--accent);
      word-break: break-word;
    }

    .qrcode-box {
      margin-top: 15px;
      background: #ffffff;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #000000;
      text-align: center;
    }

    #qrcode img, #qrcode canvas {
      margin-top: 10px;
      border: 4px solid #fff;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ offline-mesh</h1>
    <span class="badge">OFFLINE READY</span>
  </header>
  <p style="color: var(--subtext);">Zero-Internet Emergency Survival Guides & Mesh Data Transfer</p>

  <!-- Section 1: Pre-Loaded Survival Kit -->
  <div class="card">
    <h3>🚑 Offline First-Aid & Emergency Guides</h3>
    <input type="text" id="searchBox" placeholder="Search guides (e.g. CPR, Bleeding, Water)..." onkeyup="filterGuides()">
    <ul id="survivalList" style="margin-top: 12px;"></ul>
  </div>

  <!-- Section 2: Post Broadcast & QR Code Generator -->
  <div class="card">
    <h3>📢 Broadcast Mesh Update & QR Share</h3>
    <textarea id="msgInput" rows="2" placeholder="Type emergency broadcast message here..."></textarea>
    
    <div class="btn-group">
      <button class="btn-primary" onclick="postUpdate()">Broadcast Message</button>
      <button class="btn-qr" onclick="generateOfflineQR()">Show Offline QR Code</button>
    </div>
    
    <!-- Real Canvas QR Output -->
    <div id="qrContainer" class="qrcode-box" style="display: none;">
      <p style="font-weight:bold; margin:0;">Scan with Phone Camera (100% Offline Scannable):</p>
      <div id="qrcode"></div>
    </div>
  </div>

  <!-- Section 3: Live Mesh Bulletin -->
  <div class="card">
    <h3>💬 Local Bulletin Feed</h3>
    <ul id="feed"></ul>
  </div>

  <!-- Inline Mini QRCode Engine -->

  <!-- Application Logic -->
  <script>
    const survivalData = [
      { title: "CPR Guidelines", text: "Push hard and fast in center of chest (100-120 bpm). Give 2 rescue breaths for every 30 compressions." },
      { title: "Water Purification", text: "Boil water vigorously for 1 full minute. Alternatively, add 2 drops of unscented bleach per liter and let sit 30 mins." },
      { title: "Severe Bleeding", text: "Apply direct firm pressure using clean cloth. Do not remove soaked cloths—add more layers directly on top." }
    ];

    const channel = new BroadcastChannel('offline_mesh_channel');
    const feed = document.getElementById('feed');

    window.onload = () => {
      renderGuides(survivalData);
      loadSavedPosts();
    };

    function renderGuides(items) {
      document.getElementById('survivalList').innerHTML = items.map(i => `<li><strong>${i.title}:</strong> ${i.text}</li>`).join('');
    }

    function filterGuides() {
      const query = document.getElementById('searchBox').value.toLowerCase();
      renderGuides(survivalData.filter(i => i.title.toLowerCase().includes(query) || i.text.toLowerCase().includes(query)));
    }

    function postUpdate() {
      const text = document.getElementById('msgInput').value;
      if (!text) return;

      const item = { type: 'text', content: text, time: new Date().toLocaleTimeString() };
      document.getElementById('msgInput').value = '';

      channel.postMessage(item);
      saveAndRender(item);
    }

    function generateOfflineQR() {
      const text = document.getElementById('msgInput').value || (feed.firstChild ? feed.firstChild.innerText : "offline-mesh active");
      const container = document.getElementById('qrContainer');
      const qrDiv = document.getElementById('qrcode');

      container.style.display = 'flex';
      QRCode(qrDiv, text);
    }

    channel.onmessage = (event) => saveAndRender(event.data);

    function saveAndRender(item) {
      const saved = JSON.parse(localStorage.getItem('offline_mesh_posts') || '[]');
      saved.unshift(item);
      localStorage.setItem('offline_mesh_posts', JSON.stringify(saved));
      renderItem(item, true);
    }

    function loadSavedPosts() {
      const saved = JSON.parse(localStorage.getItem('offline_mesh_posts') || '[]');
      saved.forEach(item => renderItem(item, false));
    }

    function renderItem(item, prepend = false) {
      const li = document.createElement('li');
      li.innerHTML = `<span style="font-size:0.75rem; color:var(--subtext);">[${item.time}]</span><br><strong>Message:</strong> ${item.content}`;
      if (prepend && feed.firstChild) feed.insertBefore(li, feed.firstChild);
      else feed.appendChild(li);
    }
  </script>
</body>
</html>
