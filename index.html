<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffGrid Emergency Mesh</title>
  <!-- PeerJS library for WebRTC peer-to-peer data channels -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #121826; color: #fff; padding: 20px; }
    .card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    input, button { padding: 10px; border-radius: 4px; border: none; margin-top: 5px; }
    input { width: 70%; }
    button { background: #3b82f6; color: white; cursor: pointer; }
    .feed { background: #0f172a; padding: 10px; border-radius: 4px; min-height: 100px; }
  </style>
</head>
<body>

  <h2>⚡ OffGrid Local Wireless Mesh</h2>
  
  <div class="card">
    <p><strong>Your Peer ID:</strong> <span id="my-id">Generating...</span></p>
    <input type="text" id="peer-id-input" placeholder="Enter target Peer ID to connect">
    <button onclick="connectToPeer()">Connect to Wireless Node</button>
  </div>

  <div class="card">
    <h3>Broadcast Wireless Message</h3>
    <input type="text" id="msg-input" placeholder="Type emergency message...">
    <button onclick="broadcastMessage()">Send Wireless Payload</button>
  </div>

  <div class="card">
    <h3>Local Bulletin Feed</h3>
    <div id="bulletin-feed" class="feed"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
