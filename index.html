<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffGrid Emergency Mesh</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .card { background: #1e293b; padding: 18px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #334155; }
    h2, h3 { margin-top: 0; color: #38bdf8; }
    input, textarea { width: calc(100% - 24px); padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 10px; font-size: 14px; }
    button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 14px; }
    button:active { background: #0369a1; }
    .feed { background: #020617; padding: 12px; border-radius: 8px; min-height: 120px; max-height: 200px; overflow-y: auto; border: 1px solid #1e293b; }
    .msg { padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
    .code-box { font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #4ade80; text-align: center; }
  </style>
</head>
<body>

  <h2>⚡ OffGrid Mesh (6-Letter Code)</h2>

  <!-- Device Node Code -->
  <div class="card">
    <h3>Your Device Code</h3>
    <div id="my-code" class="code-box">------</div>
  </div>

  <!-- Connect to Remote Device -->
  <div class="card">
    <h3>Connect to Nearby Node</h3>
    <input type="text" id="target-code" maxlength="6" placeholder="Enter 6-Letter Target Code (e.g. A3F9Z2)">
    <button onclick="connectToNode()">Establish Wireless Link</button>
  </div>

  <!-- Broadcast Message -->
  <div class="card">
    <h3>Broadcast Emergency Message</h3>
    <input type="text" id="msg-input" placeholder="Type emergency message...">
    <button onclick="broadcastMessage()">Send Message</button>
  </div>

  <!-- Bulletin Feed -->
  <div class="card">
    <h3>Local Bulletin Feed</h3>
    <div id="bulletin-feed" class="feed"></div>
  </div>

  <script>
    // Generate a random 6-character alphanumeric code
    function generate6LetterCode() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    const myCode = generate6LetterCode();
    document.getElementById('my-code').innerText = myCode;

    let peerConnection = null;
    let dataChannel = null;

    // WebRTC connection configuration (Local network, no external servers)
    const rtcConfig = { iceServers: [] };

    function initWebRTC() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ondatachannel = (event) => {
        dataChannel = event.channel;
        setupChannelEvents();
      };
    }

    async function connectToNode() {
      const targetCode = document.getElementById('target-code').value.trim().toUpperCase();
      if (targetCode.length !== 6) {
        alert("Please enter a valid 6-character code!");
        return;
      }

      initWebRTC();
      dataChannel = peerConnection.createDataChannel("offgrid-channel");
      setupChannelEvents();

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      appendFeed("System", `Pairing initiated with Node ${targetCode}...`);
    }

    function setupChannelEvents() {
      dataChannel.onopen = () => appendFeed("System", "Wireless peer link established!");
      dataChannel.onmessage = (event) => {
        const data = JSON.parse(event.data);
        appendFeed(`Node (${data.sender})`, data.text);
      };
    }

    function broadcastMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      const payload = { sender: myCode, text: text };

      if (dataChannel && dataChannel.readyState === 'open') {
        dataChannel.send(JSON.stringify(payload));
      }

      appendFeed(`Me (${myCode})`, text);
      input.value = '';
    }

    function appendFeed(sender, text) {
      const feed = document.getElementById('bulletin-feed');
      const entry = document.createElement('div');
      entry.className = 'msg';
      entry.innerHTML = `<strong style="color:#38bdf8;">[${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}] ${sender}:</strong> ${text}`;
      feed.appendChild(entry);
      feed.scrollTop = feed.scrollHeight;
    }
  </script>
</body>
</html>
