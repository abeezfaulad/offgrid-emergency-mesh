<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffGrid Emergency Mesh</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    h2, h3 { color: #38bdf8; margin-bottom: 8px; }
    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      background: #0284c7;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #0ea5e9; }
    .status {
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }
    .status-off { background: #991b1b; color: #fecaca; }
    .status-on { background: #15803d; color: #4ade80; }
    .feed {
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      height: 200px;
      overflow-y: auto;
      border: 1px solid #1e293b;
    }
    .msg {
      padding: 6px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 14px;
    }
    .msg strong { color: #38bdf8; }
    .msg.me strong { color: #4ade80; }
    .code-box {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #4ade80;
      text-align: center;
      padding: 12px;
      background: #020617;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h2>⚡ OffGrid Emergency Mesh</h2>

  <div class="card">
    <h3>Network Status</h3>
    <div id="status" class="status status-off">⏳ Connecting…</div>
  </div>

  <div class="card">
    <h3>Your Device ID</h3>
    <div id="my-code" class="code-box">------</div>
  </div>

  <div class="card">
    <h3>Send Emergency Message</h3>
    <input type="text" id="msg-input" placeholder="Type your message…">
    <button id="send-btn">📤 SEND</button>
  </div>

  <div class="card">
    <h3>Live Bulletin Feed</h3>
    <div id="bulletin-feed" class="feed"></div>
  </div>

  <script>
    // Generate a random device ID
    const myCode = Math.random().toString(36).substring(2, 8).toUpperCase();
    document.getElementById('my-code').innerText = myCode;

    const statusDiv = document.getElementById('status');
    const feed = document.getElementById('bulletin-feed');
    const input = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');

    // Connect to the server using the same host (IP) that served this page
    const ws = new WebSocket(`ws://${window.location.host}`);

    ws.onopen = () => {
      statusDiv.className = 'status status-on';
      statusDiv.innerText = '✅ Connected to local mesh node';
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      // data = { sender, text } (see sendMessage)
      appendMessage(data.sender, data.text);
    };

    ws.onclose = () => {
      statusDiv.className = 'status status-off';
      statusDiv.innerText = '❌ Disconnected from mesh';
    };

    function sendMessage(text) {
      if (!text) return;
      const payload = { sender: myCode, text: text };
      ws.send(JSON.stringify(payload));
      appendMessage(myCode, text, true); // show as "Me"
    }

    function appendMessage(sender, text, isMe = false) {
      const div = document.createElement('div');
      div.className = 'msg' + (isMe ? ' me' : '');
      div.innerHTML = `<strong>${isMe ? 'Me' : 'Node ' + sender}:</strong> ${text}`;
      feed.appendChild(div);
      feed.scrollTop = feed.scrollHeight;
    }

    // Send on button click or Enter key
    sendBtn.addEventListener('click', () => {
      const text = input.value.trim();
      if (text) {
        sendMessage(text);
        input.value = '';
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });
  </script>
</body>
</html>
