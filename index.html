<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffGrid Local Mesh</title>
  <!-- Load QRCode library from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .card { background: #1e293b; padding: 18px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #334155; }
    h2, h3 { margin-top: 0; color: #38bdf8; }
    input { width: calc(100% - 24px); padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 10px; font-size: 14px; }
    button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 14px; }
    button:active { background: #0369a1; }
    .feed { background: #020617; padding: 12px; border-radius: 8px; min-height: 120px; max-height: 200px; overflow-y: auto; border: 1px solid #1e293b; }
    .msg { padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
    #qrcode { display: flex; justify-content: center; margin-top: 10px; background: white; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>⚡ OffGrid Emergency Mesh</h2>

  <!-- Device Identity Card -->
  <div class="card">
    <h3>Device Identification</h3>
    <input type="text" id="node-name" value="Node-101" placeholder="Enter simple Node Name (e.g. 101)">
  </div>

  <!-- Broadcast Card -->
  <div class="card">
    <h3>Broadcast Emergency Message</h3>
    <input type="text" id="msg-input" placeholder="Type emergency message here...">
    <button onclick="broadcastLocal()">1. Save & Local Broadcast</button>
    <button onclick="generateQR()">2. Generate Offline QR for Broadcast</button>
    <div id="qrcode" style="display:none;"></div>
  </div>

  <!-- Feed Card -->
  <div class="card">
    <h3>Local Bulletin Feed</h3>
    <div id="bulletin-feed" class="feed"></div>
  </div>

  <script>
    let qrcodeObj = null;

    // Load saved messages on start
    window.onload = function() {
      renderFeed();
    };

    function broadcastLocal() {
      const nodeName = document.getElementById('node-name').value.trim() || 'Node';
      const msgInput = document.getElementById('msg-input');
      const text = msgInput.value.trim();

      if (!text) return alert("Please type a message first.");

      const payload = {
        sender: nodeName,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      saveAndAppend(payload);
      msgInput.value = "";
    }

    function generateQR() {
      const nodeName = document.getElementById('node-name').value.trim() || 'Node';
      const text = document.getElementById('msg-input').value.trim();

      if (!text) return alert("Type a message to encode into QR!");

      const payloadString = `[${nodeName}] ${text}`;
      const qrContainer = document.getElementById('qrcode');
      qrContainer.style.display = 'flex';
      qrContainer.innerHTML = '';

      new QRCode(qrContainer, {
        text: payloadString,
        width: 160,
        height: 160
      });
    }

    function saveAndAppend(payload) {
      let messages = JSON.parse(localStorage.getItem('offgrid_msgs') || '[]');
      messages.push(payload);
      localStorage.setItem('offgrid_msgs', JSON.stringify(messages));
      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById('bulletin-feed');
      const messages = JSON.parse(localStorage.getItem('offgrid_msgs') || '[]');
      feed.innerHTML = '';

      messages.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<strong style="color:#38bdf8;">[${m.time}] ${m.sender}:</strong> ${m.text}`;
        feed.appendChild(div);
      });

      feed.scrollTop = feed.scrollHeight;
    }
  </script>
</body>
</html>
