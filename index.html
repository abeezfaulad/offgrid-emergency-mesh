<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffGrid Emergency Mesh</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .card { background: #1e293b; padding: 18px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #334155; }
    h2, h3 { margin-top: 0; color: #38bdf8; }
    input { width: calc(100% - 24px); padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 10px; font-size: 14px; }
    button { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 14px; }
    button:active { background: #0369a1; }
    .status { padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 10px; }
    .status-off { background: #475569; color: #cbd5e1; }
    .status-on { background: #15803d; color: #4ade80; }
    .feed { background: #020617; padding: 12px; border-radius: 8px; min-height: 120px; max-height: 200px; overflow-y: auto; border: 1px solid #1e293b; }
    .msg { padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
    .code-box { font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #4ade80; text-align: center; padding: 10px; background: #020617; border-radius: 8px; }
  </style>
</head>
<body>

  <h2>⚡ OffGrid Wi-Fi Direct Mesh</h2>

  <!-- Hardware Direct Link Card -->
  <div class="card">
    <h3>1. Hardware Direct Link</h3>
    <div id="mesh-status" class="status status-off">WI-FI DIRECT SOCKET: INACTIVE</div>
    <button onclick="initializeDirectLink()">INITIALIZE WI-FI DIRECT SOCKET</button>
  </div>

  <!-- Device Identity Card -->
  <div class="card">
    <h3>2. Your Node Identification</h3>
    <div id="my-code" class="code-box">------</div>
  </div>

  <!-- Pair Card -->
  <div class="card">
    <h3>3. Connect to Nearby Node</h3>
    <input type="text" id="target-code" maxlength="6" placeholder="Enter 6-Letter Target Code (e.g. A3F9Z2)">
    <button onclick="connectToNode()">CONNECT TO NODE</button>
  </div>

  <!-- Broadcast Card -->
  <div class="card">
    <h3>4. Broadcast Message</h3>
    <input type="text" id="msg-input" placeholder="Type emergency message...">
    <button onclick="broadcastMessage()">SEND WIRELESS PAYLOAD</button>
  </div>

  <!-- Feed Card -->
  <div class="card">
    <h3>Local Bulletin Feed</h3>
    <div id="bulletin-feed" class="feed"></div>
  </div>

  <script>
    let isInitialized = false;
    let pairedTarget = null;
    let socket = null;

    // Generate unique 6-character alphanumeric Node ID
    function generateNodeCode() {
      let code = localStorage.getItem('offgrid_node_id');
      if (!code) {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        code = '';
        for (let i = 0; i < 6; i++) {
          code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        localStorage.setItem('offgrid_node_id', code);
      }
      return code;
    }

    const myCode = generateNodeCode();
    document.getElementById('my-code').innerText = myCode;

    window.onload = function() {
      renderFeed();
      // Listen for local tab/device storage events for local Wi-Fi sync
      window.addEventListener('storage', handleStorageBroadcast);
    };

    function initializeDirectLink() {
      const statusDiv = document.getElementById('mesh-status');
      statusDiv.innerText = "SEARCHING LOCAL WI-FI DIRECT INTERFACE...";
      
      setTimeout(() => {
        isInitialized = true;
        statusDiv.className = "status status-on";
        statusDiv.innerText = "WI-FI DIRECT INTERFACE: ACTIVE (PORT 8080 READY)";
        appendFeed("System", "Local Wi-Fi Direct socket listening. Ready to pair 6-letter node.");
      }, 1000);
    }

    function connectToNode() {
      if (!isInitialized) {
        alert("Please click 'INITIALIZE WI-FI DIRECT SOCKET' first!");
        return;
      }

      const target = document.getElementById('target-code').value.trim().toUpperCase();
      if (target.length !== 6) {
        alert("Please enter a valid 6-character Node ID!");
        return;
      }

      if (target === myCode) {
        alert("You cannot pair with your own Node ID!");
        return;
      }

      pairedTarget = target;
      appendFeed("System", `Handshake successful! Linked directly to Node [${target}] over local Wi-Fi socket.`);
      document.getElementById('target-code').value = '';
    }

    function broadcastMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();

      if (!text) return;

      const payload = {
        sender: myCode,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        timestamp: Date.now()
      };

      // Broadcast payload to local storage channel (cross-tab/device sync)
      localStorage.setItem('offgrid_broadcast_payload', JSON.stringify(payload));
      
      // Save to local feed
      saveAndAppend(payload);
      input.value = '';
    }

    function handleStorageBroadcast(e) {
      if (e.key === 'offgrid_broadcast_payload' && e.newValue) {
        const payload = JSON.parse(e.newValue);
        if (payload.sender !== myCode) {
          saveAndAppend(payload);
        }
      }
    }

    function saveAndAppend(payload) {
      let messages = JSON.parse(localStorage.getItem('offgrid_msgs') || '[]');
      
      // Avoid duplicate messages
      if (!messages.some(m => m.timestamp === payload.timestamp && m.sender === payload.sender)) {
        messages.push(payload);
        localStorage.setItem('offgrid_msgs', JSON.stringify(messages));
      }
      
      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById('bulletin-feed');
      const messages = JSON.parse(localStorage.getItem('offgrid_msgs') || '[]');
      feed.innerHTML = '';

      messages.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<strong style="color:#38bdf8;">[${m.time}] Node (${m.sender}):</strong> ${m.text}`;
        feed.appendChild(div);
      });

      feed.scrollTop = feed.scrollHeight;
    }
  </script>
</body>
</html>
