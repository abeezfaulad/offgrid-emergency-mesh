<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffGrid Emergency Mesh</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    h2 { color: #38bdf8; margin-bottom: 12px; }
    .status {
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .status-off { background: #991b1b; color: #fecaca; }
    .status-on { background: #15803d; color: #4ade80; }
    .status-waiting { background: #92400e; color: #fde68a; }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      margin-bottom: 10px;
    }
    input {
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      text-align: left;
    }
    input::placeholder {
      color: #64748b;
    }
    button {
      background: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #0ea5e9; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #64748b; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #ef4444; }
    button.success { background: #059669; }
    button.success:hover { background: #10b981; }
    .hidden { display: none !important; }
    .flex { display: flex; gap: 10px; }
    .flex button { flex: 1; }
    .feed {
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      height: 250px;
      overflow-y: auto;
      border: 1px solid #1e293b;
      margin-bottom: 10px;
    }
    .msg {
      padding: 6px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 14px;
    }
    .msg .sender { color: #38bdf8; font-weight: bold; }
    .msg .sender.me { color: #4ade80; }
    .msg .time { color: #64748b; font-size: 11px; margin-left: 8px; }
    .msg.system { color: #fbbf24; font-style: italic; }
    .msg.system .sender { color: #fbbf24; }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
      margin-bottom: 0;
    }
    .input-row button {
      width: auto;
      padding: 14px 20px;
      margin-bottom: 0;
    }
    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .room-header span { color: #94a3b8; font-size: 14px; }
    .copy-btn {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .copy-btn:hover { background: #475569; }
    .participants {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px;
      background: #0f172a;
      border-radius: 8px;
      min-height: 36px;
    }
    .participant {
      background: #1e293b;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid #334155;
      color: #e2e8f0;
    }
    .participant.me { border-color: #4ade80; color: #4ade80; }
    .label { color: #94a3b8; font-size: 13px; margin-right: 8px; }
    .room-item {
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #38bdf8;
    }
    .room-item .code { font-weight: bold; font-size: 18px; color: #4ade80; letter-spacing: 2px; }
    .room-item .meta { color: #94a3b8; font-size: 13px; }
    .room-item button { width: auto; padding: 6px 20px; margin: 0; }
    .discover-btn { background: #7c3aed; }
    .discover-btn:hover { background: #8b5cf6; }
    #serverIP { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <!-- ============================================ -->
  <!-- SCREEN 1: LANDING (Create or Join) -->
  <!-- ============================================ -->
  <div id="landingScreen">
    <div class="card" style="text-align: center; padding: 40px 20px;">
      <h2>⚡ OffGrid Emergency Mesh</h2>
      <p style="color: #94a3b8; margin-bottom: 24px;">Offline communication over local Wi-Fi</p>

      <input type="text" id="nameInput" placeholder="Enter your name..." value="User" style="text-align:center; margin-bottom:20px;">

      <div class="flex" style="flex-wrap: wrap; gap: 10px;">
        <button onclick="createRoom()" style="background: #059669; flex:1;">🆕 Create Room</button>
        <button onclick="showJoinScreen()" class="secondary" style="flex:1;">🔗 Join Room</button>
        <button onclick="toggleDiscover()" class="discover-btn" style="flex:1;">📡 Discover</button>
      </div>

      <div id="discoverContainer" class="hidden" style="margin-top: 16px; text-align: left;">
        <h4 style="color: #38bdf8; margin-bottom: 8px;">Active Rooms</h4>
        <div id="roomList"></div>
        <p style="color:#64748b; font-size:13px; margin-top:8px;">Rooms appear here automatically when created.</p>
      </div>

      <p style="color: #64748b; font-size: 13px; margin-top: 20px;">Works without internet • Just a hotspot</p>
      
      <!-- Server IP Display -->
      <p style="color: #38bdf8; font-size: 14px; margin-top: 12px;">
        📡 Server IP: <span id="serverIP">loading...</span>
      </p>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- SCREEN 2: JOIN (Enter Code) -->
  <!-- ============================================ -->
  <div id="joinScreen" class="hidden">
    <div class="card">
      <h2>🔗 Join a Room</h2>
      <input type="text" id="joinCodeInput" placeholder="Enter 6-digit code" maxlength="6" style="text-transform:uppercase; text-align:center; font-size:24px; letter-spacing:4px;">
      <div class="flex">
        <button onclick="joinRoom()">Join</button>
        <button onclick="goBack()" class="secondary">Back</button>
      </div>
      <div id="joinError" style="color: #f87171; text-align: center; margin-top: 8px; font-size: 14px;"></div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- SCREEN 3: CHAT ROOM -->
  <!-- ============================================ -->
  <div id="chatScreen" class="hidden">
    <div class="card">
      <div class="room-header">
        <span>📍 Room: <strong id="roomCodeDisplay" style="color:#4ade80;">------</strong></span>
        <div>
          <button class="copy-btn" onclick="copyRoomCode()">📋 Copy</button>
          <button class="copy-btn" onclick="leaveRoom()" style="background:#dc2626; color:white;">✕ Leave</button>
        </div>
      </div>

      <div id="status" class="status status-waiting">⏳ Waiting for others to join...</div>

      <div style="margin-top: 10px;">
        <span class="label">👥 Participants:</span>
        <div id="participantList" class="participants">
          <span style="color:#64748b; font-size:13px;">Waiting for connection...</span>
        </div>
      </div>

      <div id="chatFeed" class="feed"></div>
      <div class="input-row" style="gap: 8px;">
        <input type="text" id="chatInput" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" style="flex:0 0 auto; width:auto; padding:14px 20px;">📤</button>
        <button onclick="sendSOS()" style="flex:0 0 auto; width:auto; padding:14px 20px; background:#dc2626;">🚨</button>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let myRoom = null;
    let myName = null;
    let participants = [];
    let discoverInterval = null;

    // ----- UI Helpers -----
    function showScreen(id) {
      document.getElementById('landingScreen').classList.add('hidden');
      document.getElementById('joinScreen').classList.add('hidden');
      document.getElementById('chatScreen').classList.add('hidden');
      document.getElementById(id).classList.remove('hidden');
    }

    function showJoinScreen() {
      document.getElementById('joinError').innerText = '';
      showScreen('joinScreen');
    }

    function goBack() {
      showScreen('landingScreen');
    }

    function copyRoomCode() {
      const code = document.getElementById('roomCodeDisplay').innerText;
      navigator.clipboard.writeText(code).then(() => {
        alert('Room code copied!');
      }).catch(() => {
        const input = document.createElement('input');
        input.value = code;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        alert('Room code copied!');
      });
    }

    function getMyName() {
      let name = document.getElementById('nameInput').value.trim();
      if (!name) {
        name = localStorage.getItem('offgrid-username') || 'User';
        document.getElementById('nameInput').value = name;
      } else {
        localStorage.setItem('offgrid-username', name);
      }
      return name;
    }

    // ----- WebSocket Connection -----
    function connectToServer() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => {
        console.log('✅ Connected to server');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleServerMessage(data);
      };

      ws.onclose = () => {
        const status = document.getElementById('status');
        if (status) {
          status.className = 'status status-off';
          status.innerText = '❌ Disconnected from server';
        }
        setTimeout(connectToServer, 2000);
      };

      ws.onerror = (err) => {
        console.warn('WebSocket error:', err);
      };
    }

    // ----- Handle incoming messages -----
    function handleServerMessage(data) {
      if (data.type === 'created') {
        myRoom = data.room;
        document.getElementById('roomCodeDisplay').innerText = myRoom;
        const status = document.getElementById('status');
        status.className = 'status status-waiting';
        status.innerText = '⏳ Waiting for others to join... (Share your code)';
        showScreen('chatScreen');
        // Stop discovery polling when in chat
        clearInterval(discoverInterval);
        document.getElementById('discoverContainer').classList.add('hidden');
      }
      else if (data.type === 'joined') {
        myRoom = data.room;
        document.getElementById('roomCodeDisplay').innerText = myRoom;
        const status = document.getElementById('status');
        status.className = 'status status-on';
        status.innerText = '✅ Connected to room!';
        showScreen('chatScreen');
        clearInterval(discoverInterval);
        document.getElementById('discoverContainer').classList.add('hidden');
      }
      else if (data.type === 'participants') {
        participants = data.names || [];
        renderParticipants();
      }
      else if (data.type === 'error') {
        document.getElementById('joinError').innerText = data.text;
      }
      else if (data.type === 'system') {
        appendMessage('🔄 System', data.text, true);
      }
      else if (data.type === 'message') {
        const isMe = data.sender === myName;
        const isSOS = data.isSOS === true;
        appendMessage(data.sender, data.text, false, isMe, isSOS);
        if (!isMe && !isSOS) {
          // Play notification sound
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 800;
            osc.type = 'sine';
            gain.gain.value = 0.05;
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
          } catch(e) { /* ignore */ }
        }
      }
    }

    function renderParticipants() {
      const container = document.getElementById('participantList');
      if (!participants || participants.length === 0) {
        container.innerHTML = '<span style="color:#64748b; font-size:13px;">No one else here yet.</span>';
        return;
      }
      container.innerHTML = participants.map(name => {
        const isMe = name === myName;
        return `<span class="participant ${isMe ? 'me' : ''}">${name} ${isMe ? '(You)' : ''}</span>`;
      }).join('');
    }

    // ----- Room Actions -----
    function createRoom() {
      myName = getMyName();
      connectToServer();
      const check = setInterval(() => {
        if (ws && ws.readyState === 1) {
          clearInterval(check);
          ws.send(JSON.stringify({ type: 'create', name: myName }));
        }
      }, 100);
    }

    function joinRoom() {
      const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
      if (code.length !== 6) {
        document.getElementById('joinError').innerText = 'Please enter a 6-digit code';
        return;
      }
      myName = getMyName();
      connectToServer();
      const check = setInterval(() => {
        if (ws && ws.readyState === 1) {
          clearInterval(check);
          ws.send(JSON.stringify({ type: 'join', room: code, name: myName }));
        }
      }, 100);
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== 1) return;

      ws.send(JSON.stringify({
        type: 'message',
        text: text
      }));

      appendMessage(myName, text, false, true);
      input.value = '';
    }

    function sendSOS() {
      if (!ws || ws.readyState !== 1) {
        alert('Not connected to a room.');
        return;
      }
      const text = '🚨 SOS EMERGENCY - I NEED HELP!';
      ws.send(JSON.stringify({
        type: 'message',
        sender: myName,
        text: text,
        isSOS: true
      }));
      appendMessage(myName, text, false, true, true);
    }

    function leaveRoom() {
      if (ws) ws.close();
      myRoom = null;
      participants = [];
      showScreen('landingScreen');
      document.getElementById('chatFeed').innerHTML = '';
      document.getElementById('participantList').innerHTML = '';
      // Restart discovery polling if discover panel is open
      if (!document.getElementById('discoverContainer').classList.contains('hidden')) {
        startDiscoveryPolling();
      }
    }

    // ----- Radar / Discovery -----
    async function toggleDiscover() {
      const container = document.getElementById('discoverContainer');
      if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        await discoverRooms();
        startDiscoveryPolling();
      } else {
        container.classList.add('hidden');
        clearInterval(discoverInterval);
      }
    }

    async function discoverRooms() {
      const list = document.getElementById('roomList');
      try {
        const res = await fetch('/rooms');
        const rooms = await res.json();
        if (rooms.length === 0) {
          list.innerHTML = '<p style="color:#64748b; font-size:14px;">No active rooms found. Create one!</p>';
        } else {
          list.innerHTML = rooms.map(room => `
            <div class="room-item">
              <div>
                <span class="code">${room.code}</span>
                <span class="meta">(${room.participants} participant${room.participants !== 1 ? 's' : ''})</span>
              </div>
              <button onclick="quickJoin('${room.code}')" class="success">Join</button>
            </div>
          `).join('');
        }
      } catch (e) {
        list.innerHTML = '<p style="color:#f87171; font-size:14px;">Could not fetch rooms. Make sure you are connected.</p>';
      }
    }

    function quickJoin(roomCode) {
      document.getElementById('joinCodeInput').value = roomCode;
      showJoinScreen();
      // Automatically join after a short delay
      setTimeout(() => {
        joinRoom();
      }, 300);
    }

    function startDiscoveryPolling() {
      clearInterval(discoverInterval);
      discoverInterval = setInterval(() => {
        if (!document.getElementById('discoverContainer').classList.contains('hidden')) {
          discoverRooms();
        }
      }, 5000);
    }

    // ----- Render messages -----
    function appendMessage(sender, text, isSystem = false, isMe = false, isSOS = false) {
      const feed = document.getElementById('chatFeed');
      const div = document.createElement('div');
      div.className = 'msg' + (isSystem ? ' system' : '');

      if (isSOS) {
        div.style.background = '#7f1d1d';
        div.style.border = '2px solid #ef4444';
        div.style.borderRadius = '4px';
        div.style.padding = '8px';
        div.style.margin = '4px 0';
        div.style.fontWeight = 'bold';
      }

      if (isSystem) {
        div.innerHTML = `<span class="sender">${sender}</span> ${text}`;
      } else {
        const senderClass = isMe ? 'me' : '';
        const time = new Date().toLocaleTimeString();
        div.innerHTML = `<span class="sender ${senderClass}">${sender}</span><span class="time">${time}</span> ${text}`;
      }

      feed.appendChild(div);
      feed.scrollTop = feed.scrollHeight;
    }

    // ----- Init -----
    document.getElementById('nameInput').value = localStorage.getItem('offgrid-username') || '';
    showScreen('landingScreen');

    // Fetch and display server IP
    fetch('/server-ip')
      .then(res => res.json())
      .then(data => {
        document.getElementById('serverIP').textContent = data.ip;
      })
      .catch(() => {
        document.getElementById('serverIP').textContent = 'Check terminal for IP';
      });
  </script>
</body>
</html>
