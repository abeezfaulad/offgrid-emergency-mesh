<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffGrid Local Mesh</title>
  <style>
    body { font-family: sans-serif; background: #121826; color: #fff; padding: 20px; }
    .card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    input, button, textarea { padding: 10px; border-radius: 4px; border: none; margin-top: 5px; }
    textarea { width: 90%; height: 60px; background: #0f172a; color: #fff; }
    button { background: #3b82f6; color: white; cursor: pointer; }
    .feed { background: #0f172a; padding: 10px; border-radius: 4px; min-height: 100px; }
  </style>
</head>
<body>
  <h2>⚡ OffGrid Pure Offline WebRTC</h2>

  <!-- Device 1: Host -->
  <div class="card">
    <h3>Step 1: Host (Device A)</h3>
    <button onclick="createOffer()">Generate Connection Token</button>
    <br><br>
    <textarea id="local-token" readonly placeholder="Your token will appear here..."></textarea>
  </div>

  <!-- Device 2: Connect -->
  <div class="card">
    <h3>Step 2: Joiner (Device B)</h3>
    <textarea id="remote-token" placeholder="Paste partner's token here..."></textarea>
    <br>
    <button onclick="handleRemoteToken()">Accept Connection Token</button>
  </div>

  <!-- Messaging UI -->
  <div class="card">
    <h3>Broadcast Wireless Message</h3>
    <input type="text" id="msg-input" placeholder="Type emergency message...">
    <button onclick="sendMessage()">Send Wireless Payload</button>
  </div>

  <div class="card">
    <h3>Local Bulletin Feed</h3>
    <div id="bulletin-feed" class="feed"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
